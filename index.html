<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAQUE COMARES · Gestión de torneos escolares de ajedrez</title>
  <meta name="description" content="Gestión de torneos escolares de ajedrez por sistema suizo. IES Marqués de Comares, Lucena (Córdoba).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%237a1f26'/%3E%3Ctext x='50' y='72' font-size='70' text-anchor='middle' fill='%23f8f2e7'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <nav class="tabs" id="tabs" aria-label="Secciones del torneo"></nav>
    <main id="main" tabindex="-1"></main>
    <footer class="footer">
      JAQUE COMARES · IES Marqués de Comares – Lucena (Córdoba) · Los datos se guardan automáticamente en este navegador.
    </footer>
  </div>

  <!-- Zona que se imprime (informes) -->
  <div id="printArea" aria-hidden="true"></div>

  <dialog id="dlg">
    <form method="dialog" id="dlgForm" novalidate>
      <h2 id="dlgTitle"></h2>
      <div id="dlgBody"></div>
      <div class="dlg-actions">
        <button type="button" class="btn" id="dlgCancel">Cancelar</button>
        <button type="submit" class="btn primary" id="dlgOk">Aceptar</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="fileBackup" accept=".json,application/json" hidden>
  <input type="file" id="fileCsv" accept=".csv,.txt,text/csv,text/plain" hidden>

  <script src="js/swiss.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
